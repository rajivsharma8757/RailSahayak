server:
  port: ${PORT:8081}
spring:
  application:
    name: railsahayak-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railsahayak}
    username: ${DB_USERNAME:railsahayak}
    password: ${DB_PASSWORD:railsahayak_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
