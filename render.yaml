services:
  - type: web
    name: railsahayak-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: railsahayak-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: railsahayak-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: railsahayak-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: railsahayak-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: railsahayak-postgres
          property: password
      - key: RAILSAHAYAK_RATE_LIMIT_TRUST_FORWARDED_FOR
        value: "true"
      - key: DEMO_PASSENGER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: railsahayak-postgres
    plan: free
    region: singapore
    databaseName: railsahayak
    user: railsahayak
